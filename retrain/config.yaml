# SignalScope Retraining Configuration

dataset:
  name: "CIFAKE"
  source: "https://www.kaggle.com/datasets/birdy654/cifake-real-and-ai-generated-synthetic-images"
  # CIFAKE ships train/ (50k REAL + 50k FAKE) and test/ (10k REAL + 10k FAKE).
  # Validation is carved out of train; test/ stays held out for reporting.
  val_fraction: 0.10
  classes:
    - REAL  # CIFAR-10 images
    - FAKE  # Stable Diffusion v1.4 images
  image_size: 32  # CIFAKE native resolution
  num_workers: 4

model:
  spatial_backbone: "resnet34"  # Options: resnet18, resnet34, resnet50, efficientnet_b0
  frequency_stream: true
  num_classes: 1  # Binary classification: REAL (0) vs FAKE (1)
  dropout_rate: 0.3

training:
  epochs: 10
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.01
  loss_function: "bce_with_logits"
  optimizer: "adamw"
  lr_scheduler: "cosine"
  device: "auto"  # auto, cuda, or cpu
  seed: 42

paths:
  data_dir: "retrain/data"  # CIFAKE root: contains train/ and test/
  checkpoint_dir: "retrain/checkpoints"
  best_model_name: "best_model.pt"
  manifest_path: null  # Optional manifest JSON; null scans the CIFAKE folders
